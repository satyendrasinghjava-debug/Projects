#
# SentinelGuard :: complete local stack
#
#   docker compose up --build            start Redis, Kafka and the service
#   docker compose --profile tools up -d add Kafka UI on http://localhost:8081
#   docker compose down -v               stop and discard all state
#
# Kafka runs in KRaft mode: no ZooKeeper, one process, one container.
# ---------------------------------------------------------------------------

name: sentinelguard

services:

  # =======================================================================
  # Distributed quota store
  # =======================================================================
  redis:
    image: redis:7.4-alpine
    container_name: sentinelguard-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # Quota buckets are self-expiring and cheap to rebuild, so evicting the
      # coldest ones under memory pressure is preferable to refusing writes
      # (which would push every request onto the fail-open/closed path).
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - sentinelguard-net

  # =======================================================================
  # Alert transport
  # =======================================================================
  kafka:
    image: apache/kafka:3.8.1
    container_name: sentinelguard-kafka
    restart: unless-stopped
    ports:
      # Published for tools running on the host; containers always use 19092.
      # 9092 is left alone by default because it is the port every other local
      # Kafka already occupies - override with KAFKA_HOST_PORT if you want it.
      - "${KAFKA_HOST_PORT:-29092}:9092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      # The service declares fraud-alerts itself with the right partition count;
      # implicit creation would silently give it one partition.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - sentinelguard-net

  # =======================================================================
  # The service itself
  # =======================================================================
  sentinelguard:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinelguard:1.0.0
    container_name: sentinelguard-app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SENTINELGUARD_ALERT_TOPIC: fraud-alerts
      # true favours availability, false favours protection. Flip to false for
      # payment or authentication surfaces.
      SENTINELGUARD_FAIL_OPEN: "true"
      # Only enable when a proxy in front of this service overwrites
      # X-Forwarded-For; otherwise a caller can rotate it to mint fresh quotas.
      SENTINELGUARD_TRUST_FORWARDED: "false"
      SENTINELGUARD_LOG_LEVEL: INFO
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - sentinelguard-net

  # =======================================================================
  # Optional: inspect the fraud-alerts topic in a browser
  #   docker compose --profile tools up -d kafka-ui
  # =======================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sentinelguard-kafka-ui
    profiles:
      - tools
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sentinelguard-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - sentinelguard-net

volumes:
  redis-data:
    driver: local
  kafka-data:
    driver: local

networks:
  sentinelguard-net:
    driver: bridge
